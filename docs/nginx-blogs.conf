# BlogFlow CMS — Nginx rules for a blog installed in /blogs/.
# Paste these location blocks inside your existing `server { ... }` block, ABOVE any
# generic `location /` or `location ~ \.php$` rules of the main website.
# Adjust the php-fpm socket path to your server.

# Never serve private application folders or sensitive files.
location ~ ^/blogs/(app|config|database|storage|vendor|bin|tests)(/|$) { deny all; return 404; }
location ~ ^/blogs/.*\.(sql|log|md|lock|ini|sh|dist|sample|bak)$ { deny all; return 404; }
location ~ ^/blogs/composer\.(json|lock)$ { deny all; return 404; }
location ~ /\.(?!well-known) { deny all; return 404; }

# Uploads: images only, never executed.
location ^~ /blogs/uploads/ {
    location ~* \.(jpe?g|png|webp|avif|gif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    return 404;
}

# Static assets (CSS/JS/fonts) with long-lived caching; file names are versioned.
location ^~ /blogs/assets/ {
    location ~* \.php$ { return 404; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Installer (locks itself after setup).
location = /blogs/install/ { try_files $uri /blogs/install/index.php$is_args$args; }

# Everything else goes to the front controller.
location /blogs/ {
    try_files $uri $uri/ /blogs/index.php$is_args$args;
}

location ~ ^/blogs/(index|install/index|admin/index)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Any other .php file under /blogs/ is never executed.
location ~ ^/blogs/.*\.php$ { return 404; }
